---
name: CI

'on':
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Set up Python 3.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.12'

      - name: Install test dependencies.
        run: python -m pip install -r requirements-ci.txt

      - name: Lint YAML.
        run: yamllint .

      - name: Run the rule unit tests.
        run: pytest

      # A rule that fails to import is silently absent rather than an error, so
      # prove ansible-lint actually loads both of them.
      - name: Verify the rules load.
        run: |
          ansible-lint -R -r . -L --nocolor | tee /tmp/rules.txt
          grep -q 'become-first' /tmp/rules.txt
          grep -q 'no-host-os-vars' /tmp/rules.txt
